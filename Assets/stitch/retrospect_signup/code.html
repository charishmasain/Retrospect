<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Retrospect | Create My Agent</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,700;1,6..72,400&amp;display=swap" rel="stylesheet"/>
<!-- Icons -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "outline": "#918fa1",
                      "on-tertiary-fixed-variant": "#39485a",
                      "primary-container": "#8781ff",
                      "surface-container-low": "#1b1b20",
                      "secondary-fixed-dim": "#28dfb5",
                      "on-error": "#690005",
                      "tertiary-fixed": "#d4e4fa",
                      "primary": "#c4c0ff",
                      "primary-fixed": "#e3dfff",
                      "secondary-container": "#00d1a7",
                      "on-tertiary-fixed": "#0d1c2d",
                      "tertiary": "#b9c8de",
                      "on-tertiary": "#233143",
                      "surface-container-highest": "#35343a",
                      "primary-fixed-dim": "#c4c0ff",
                      "on-primary": "#2000a4",
                      "inverse-surface": "#e4e1e9",
                      "surface-variant": "#35343a",
                      "on-primary-fixed": "#100069",
                      "tertiary-fixed-dim": "#b9c8de",
                      "surface-container-lowest": "#0e0e13",
                      "outline-variant": "#464555",
                      "surface-tint": "#c4c0ff",
                      "tertiary-container": "#8392a6",
                      "surface": "#131318",
                      "surface-dim": "#131318",
                      "on-secondary-container": "#005441",
                      "on-surface": "#e4e1e9",
                      "error-container": "#93000a",
                      "surface-container-high": "#2a292f",
                      "on-primary-fixed-variant": "#3622ca",
                      "inverse-on-surface": "#303036",
                      "error": "#ffb4ab",
                      "secondary": "#41eec2",
                      "inverse-primary": "#4f44e2",
                      "on-tertiary-container": "#1c2b3c",
                      "on-error-container": "#ffdad6",
                      "surface-container": "#1f1f25",
                      "on-secondary-fixed-variant": "#00513f",
                      "on-secondary": "#00382b",
                      "background": "#131318",
                      "surface-bright": "#39383e",
                      "on-secondary-fixed": "#002118",
                      "on-surface-variant": "#c7c4d8",
                      "on-primary-container": "#1b0091",
                      "on-background": "#e4e1e9",
                      "secondary-fixed": "#55fcd0"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "fontFamily": {
                      "headline": ["Newsreader"],
                      "body": ["Manrope"],
                      "label": ["Manrope"]
              }
            },
          },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-obsidian { background-color: #0a0a0f; }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #1e1e2e;
            backdrop-filter: blur(24px);
        }
        .glow-center {
            background: radial-gradient(circle at center, rgba(196, 192, 255, 0.08) 0%, transparent 70%);
        }
    </style>
</head>
<body class="bg-obsidian font-body text-on-surface selection:bg-primary-container selection:text-on-primary-container min-h-screen flex flex-col relative overflow-x-hidden">
<!-- Global Layout Decorator -->
<div class="fixed inset-0 glow-center pointer-events-none"></div>
<!-- Navigation Suppressed for Signup Page as per Destination Rule -->
<main class="flex-grow flex items-center justify-center p-6 relative z-10">
<!-- Centered Signup Card -->
<div class="glass-card w-full max-w-[480px] rounded-[16px] p-8 md:p-12 shadow-2xl transition-all duration-500">
<!-- 1. Centered Logo -->
<div class="flex flex-col items-center gap-3 mb-10">
<div class="w-12 h-12 rounded-xl bg-primary/10 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="psychology">psychology</span>
</div>
<h1 class="text-2xl font-headline italic text-primary tracking-tight">Retrospect</h1>
</div>
<!-- 2. Typography -->
<div class="text-center mb-8">
<h2 class="text-3xl font-headline font-bold text-on-surface mb-3 tracking-tight">Start remembering your decisions</h2>
<p class="text-slate-400 text-sm leading-relaxed max-w-[280px] mx-auto">Your agent gets smarter with every decision you log</p>
</div>
<form class="space-y-6">
<!-- 3. Role Selector -->
<div class="space-y-3">
<label class="text-[10px] font-label font-bold tracking-widest text-slate-500 uppercase ml-1">I am a...</label>
<div class="grid grid-cols-2 gap-3">
<button class="group relative flex items-center justify-center gap-2 py-3 px-4 rounded-xl border border-outline-variant/10 bg-surface-container-low hover:bg-surface-container-high transition-all text-sm font-medium" type="button">
<span>🚀</span> Founder
                        </button>
<button class="group relative flex items-center justify-center gap-2 py-3 px-4 rounded-xl border border-primary/40 bg-primary/5 text-primary transition-all text-sm font-medium" type="button">
<span>💼</span> Freelancer
                        </button>
<button class="group relative flex items-center justify-center gap-2 py-3 px-4 rounded-xl border border-outline-variant/10 bg-surface-container-low hover:bg-surface-container-high transition-all text-sm font-medium" type="button">
<span>⚡</span> Builder
                        </button>
<button class="group relative flex items-center justify-center gap-2 py-3 px-4 rounded-xl border border-outline-variant/10 bg-surface-container-low hover:bg-surface-container-high transition-all text-sm font-medium" type="button">
<span>🎨</span> Creator
                        </button>
</div>
</div>
<!-- 4. Form Fields -->
<div class="space-y-4">
<div class="space-y-1.5">
<label class="text-[10px] font-label font-bold tracking-widest text-slate-500 uppercase ml-1" for="fullname">Full name</label>
<input class="w-full px-5 py-4 bg-surface-container-lowest border border-outline-variant/10 rounded-xl focus:ring-1 focus:ring-primary focus:border-primary/50 text-on-surface placeholder:text-slate-600 outline-none transition-all" id="fullname" placeholder="Elias Vance" type="text"/>
</div>
<div class="space-y-1.5">
<label class="text-[10px] font-label font-bold tracking-widest text-slate-500 uppercase ml-1" for="email">Email address</label>
<input class="w-full px-5 py-4 bg-surface-container-lowest border border-outline-variant/10 rounded-xl focus:ring-1 focus:ring-primary focus:border-primary/50 text-on-surface placeholder:text-slate-600 outline-none transition-all" id="email" placeholder="elias@retrospect.ai" type="email"/>
</div>
<div class="space-y-1.5">
<label class="text-[10px] font-label font-bold tracking-widest text-slate-500 uppercase ml-1" for="password">Password</label>
<div class="relative">
<input class="w-full px-5 py-4 bg-surface-container-lowest border border-outline-variant/10 rounded-xl focus:ring-1 focus:ring-primary focus:border-primary/50 text-on-surface placeholder:text-slate-600 outline-none transition-all" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-xl" data-icon="visibility">visibility</span>
</button>
</div>
</div>
</div>
<!-- 5. CTA -->
<div class="pt-4">
<button class="w-full py-4 bg-gradient-to-r from-primary to-primary-container text-on-primary-fixed font-bold rounded-xl transition-all hover:opacity-90 active:scale-[0.98] shadow-[0_8px_30px_rgb(196,192,255,0.15)]" type="submit">
                        Create My Agent
                    </button>
</div>
</form>
<!-- 6. Footer link -->
<div class="mt-8 text-center">
<p class="text-slate-400 text-sm">
                    Already have an account? 
                    <a class="text-primary font-semibold hover:underline ml-1" href="#">Sign in</a>
</p>
</div>
</div>
</main>
<!-- Visual Anchor: Floating Memory Thread (as per system guidelines) -->
<div class="absolute top-0 left-1/4 w-[1px] h-32 bg-gradient-to-b from-primary/20 to-transparent pointer-events-none"></div>
<div class="absolute bottom-0 right-1/3 w-[1px] h-48 bg-gradient-to-t from-primary/10 to-transparent pointer-events-none"></div>
<!-- Small Footer Component (from JSON guidance but simplified for transactional focus) -->
<footer class="flex flex-col items-center w-full px-8 py-10 max-w-7xl mx-auto gap-4 z-10">
<p class="text-[10px] font-label tracking-widest text-slate-600 uppercase">© 2024 Retrospect AI. Private Gallery of Thought.</p>
<div class="flex gap-6">
<a class="text-slate-600 hover:text-primary text-[10px] tracking-widest uppercase transition-colors" href="#">Privacy</a>
<a class="text-slate-600 hover:text-primary text-[10px] tracking-widest uppercase transition-colors" href="#">Terms</a>
</div>
</footer>
</body></html>
